plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

// Optional JEI integration (recipe tabs, drag & drop onto the Target Slot). Set jei_enabled=false in
// gradle.properties to build without it: the JEI classes are then excluded from compilation.
def jeiEnabled = (project.findProperty('jei_enabled') ?: 'false').toString() == 'true'

// Optional Jade integration (tooltip with balance / owner when you look at the block). Disabled until you put a Jade
// dependency into gradle.properties, e.g.  jade_dependency=maven.modrinth:jade:<version id from modrinth.com/mod/jade>
def jadeDependency = (project.findProperty('jade_dependency') ?: '').toString().trim()
def jadeEnabled = !jadeDependency.isEmpty()

repositories {
    if (jadeEnabled) {
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        maven {
            name = 'BlameJaredJade'
            url = 'https://maven.blamejared.com'
            content { includeGroup 'snownee.jade' }
        }
    }
    if (jeiEnabled) {
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
            content {
                includeGroup 'mezz.jei'
                includeGroup 'net.mezzdev.config'
            }
        }
    }
}

sourceSets.main.java {
    if (!jeiEnabled) {
        exclude 'dev/voidrecycler/integration/jei/**'
    }
    if (jadeEnabled) {
        // the Jade plugin lives outside src/main so it can never break a build that has no Jade dependency
        srcDir 'src/optional/jade/java'
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users starting with 26.1.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    if (jadeEnabled) {
        compileOnly jadeDependency
        localRuntime jadeDependency
    }
    if (jeiEnabled) {
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
        // full JEI only in the dev runs (runClient), never shipped with the jar
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}

// Pure-logic unit tests (PointMath): no Minecraft bootstrap needed.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
